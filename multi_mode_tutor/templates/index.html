<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Mode Tutor - Select Exam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Multi Mode Tutor</h1>
            <p class="subtitle">Empowering Your Competitive Exam Journey</p>
        </header>

        <section class="selection-area">
            <h2 style="text-align: center; margin-bottom: 20px;">Select Your Exam</h2>
            <div class="grid">
                {% for exam in exams %}
                <a href="{{ url_for('subjects', level=exam) }}" class="card">
                    <i class="fas fa-graduation-cap"></i>
                    <h2>{{ exam }}</h2>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 10px;">Prepare for success in {{ exam }}</p>
                </a>
                {% endfor %}
            </div>
        </section>
    </div>
</body>
</html>
